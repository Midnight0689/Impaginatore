<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impaginatore</title>
<style>
  :root { --bg: #2b2b2b; --panel: #333; --panel2: #3b3b3b; --line: #4a4a4a; --text: #e6e6e6; --dim: #a0a0a0; --accent: #e0b23c; --accent-ink: #231a00; --danger: #d9605a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  button, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
  button { cursor: pointer; } button:hover { border-color: #777; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 28px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #verb { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; } #verb i { width: 9px; height: 9px; border-radius: 50%; background: #666; display: inline-block; } #verb.ok i { background: #3fb950; } #verb.nuova { background: #e0a526; color: #1a1a1a; border-color: #e0a526; } #verb.nuova i { background: #1a1a1a; } #verb.off i { background: #e5484d; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  main { padding: 28px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; }
  .card:hover { border-color: var(--accent); }
  .card .cv { height: 150px; background: #444 center/cover; display: flex; align-items: center; justify-content: center; color: #777; font-size: 12px; }
  .card .tx { padding: 10px 12px 12px; }
  .card .nm { font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { color: var(--dim); font-size: 12px; }
  .card .dot { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--accent); }
  .card .mn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); border: none; padding: 1px 8px; border-radius: 10px; }
  .new { border-style: dashed; display: flex; align-items: center; justify-content: center; min-height: 230px; flex-direction: column; gap: 8px; color: var(--dim); font-size: 15px; }
  .new b { font-size: 40px; font-weight: 300; color: var(--accent); line-height: 1; }
  .empty { color: var(--dim); }
  #menu { position: fixed; background: #222; border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: none; z-index: 20; min-width: 190px; }
  #menu div { padding: 6px 12px; border-radius: 5px; cursor: pointer; } #menu div:hover { background: var(--panel2); } #menu .d { color: var(--danger); }
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 30; }
  .dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; width: 460px; max-width: 92vw; }
  .dlg h3 { margin: 0 0 14px; font-size: 17px; }
  .dlg label { display: block; color: var(--dim); font-size: 12px; margin: 12px 0 4px; }
  .dlg input { width: 100%; } .dlg .two { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; } .dlg .two span { color: var(--dim); }
  .dlg .pre { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; } .dlg .pre button { padding: 3px 9px; font-size: 12px; }
  .dlg .info { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 17px; }
  .dlg .adv { display: none; } .dlg .adv.on { display: block; } .dlg .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .dlg .err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
  .spin { width: 34px; height: 34px; border: 3px solid #555; border-top-color: var(--accent); border-radius: 50%; animation: r 1s linear infinite; margin: 0 auto 12px; } @keyframes r { to { transform: rotate(360deg); } }
  /* ===== Tema scuro in stile Apple ===== */
  :root { --bg: #1b1b1d; --panel: #252528; --panel2: #333337; --line: rgba(255,255,255,.1); --text: #f2f2f7; --dim: #98989f; --blue: #0a84ff; --blue2: #409cff; --danger: #ff6961; }
  html, body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -.006em; }
  button, input { border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 500; transition: background .12s, transform .06s; }
  input { background: #1b1b1d; border: 1px solid var(--line); font-weight: 400; } input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,132,255,.25); }
  button:hover:not(:disabled) { background: #424247; border-color: transparent; } button:active { transform: scale(.97); }
  button.primary { background: var(--blue); color: #fff; border: 0; } button.primary:hover { background: var(--blue2); }
  header { padding: 12px 28px; background: rgba(37,37,40,.88); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  #verb { background: rgba(255,255,255,.08); } #verb.nuova { background: #e0a526; }
  main { padding: 36px 28px; }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; text-transform: none; color: var(--text); margin-bottom: 18px; }
  .grid { gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.3); transition: transform .15s, box-shadow .15s, border-color .15s; }
  .card:hover { border-color: rgba(255,255,255,.22); transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,.5); }
  .card .cv { height: 160px; background-color: #151517; }
  .card .tx { padding: 12px 14px 14px; } .card .nm { font-size: 15px; font-weight: 650; }
  .card .dot { background: rgba(0,0,0,.55); color: #32d74b; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .card .mn { -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .new { border: 1.5px dashed rgba(255,255,255,.2); background: transparent; box-shadow: none; } .new:hover { border-color: var(--blue); background: rgba(10,132,255,.07); transform: none; box-shadow: none; }
  .new b { color: var(--blue2); font-size: 44px; }
  #menu { background: rgba(44,44,47,.97); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 50px rgba(0,0,0,.55); padding: 6px; } #menu div { border-radius: 8px; padding: 7px 12px; } #menu div:hover { background: var(--blue); color: #fff; }
  .veil { background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .dlg { background: rgba(44,44,47,.96); border: 1px solid var(--line); border-radius: 16px; padding: 24px 28px; box-shadow: 0 24px 70px rgba(0,0,0,.6); }
  .dlg h3 { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  .spin { border-color: rgba(255,255,255,.18); border-top-color: var(--blue); }
  #credit { position: fixed; right: 18px; bottom: 12px; font-size: 12px; color: var(--dim); letter-spacing: .02em; pointer-events: none; user-select: none; } #credit b { color: inherit; font-weight: 600; opacity: .9; }
</style>
</head>
<body>
<header>
  <h1>Impaginatore</h1>
  <button id="verb" title="Versione in uso e controllo aggiornamenti"><i id="vdot"></i><span id="vtxt">Versione…</span></button>
  <button id="upd" style="display:none;background:#e0a526;color:#1a1a1a;font-weight:700" title="">⬆ Aggiornamento disponibile</button>
  <button id="add" title="Apri un progetto che sta in un'altra cartella (quella con progetto.json)">Apri progetto esistente…</button>
  <button id="addzip" title="Importa un progetto esportato come file ZIP (Esporta progetto dall'editor)">Importa ZIP…</button>
  <button id="quit" title="Chiude il programma">Chiudi programma</button>
</header>
<main>
  <h2>Progetti</h2>
  <div class="grid" id="grid"></div>
  <p class="empty" id="where"></p>
</main>

<div id="menu"></div>

<div class="veil" id="vver"><div class="dlg">
  <h3>Versione del programma</h3>
  <div id="vbody" style="line-height:1.8;font-size:14px"></div>
  <div style="margin-top:12px"><a href="#" id="vhist" style="color:var(--dim);font-size:13px">▸ Versioni precedenti (tornare indietro)</a><div id="vlist" style="display:none;max-height:220px;overflow:auto;margin-top:8px;font-size:13px"></div></div>
  <div class="btns"><button id="vchk">Controlla aggiornamenti</button><button id="vgo" class="primary" style="display:none">Aggiorna ora</button><button id="vclose">Chiudi</button></div>
</div></div>

<div class="veil" id="vnew"><div class="dlg">
  <h3>Nuovo progetto</h3>
  <label>Nome del progetto</label><input id="nome" placeholder="Es. Battesimo Serena" autofocus>
  <label>Cartella delle foto (facoltativa: il progetto nasce accanto, in «Impaginatore»)</label>
  <div class="two" style="grid-template-columns:1fr auto"><input id="fdir" placeholder="Nessuna: userò una cartella Foto nel progetto" readonly><button id="fpick" type="button">Scegli…</button></div>
  <label>Dimensioni dell'album aperto (due pagine), in cm</label>
  <div class="two"><input id="w" inputmode="decimal" placeholder="Larghezza" value="60"><span>×</span><input id="h" inputmode="decimal" placeholder="Altezza" value="22,5"></div>
  <div class="pre"><button data-p="60,22.5">60 × 22,5</button><button data-p="70,25">70 × 25</button><button data-p="50,20">50 × 20</button><button data-p="40,30">40 × 30</button></div>
  <div class="info" id="pinfo"></div>
  <label style="cursor:pointer" id="advt">▸ Avanzate (abbondanza, spazio tra le foto, margine)</label>
  <div class="adv" id="adv"><div class="three">
    <div><label>Abbondanza (mm)</label><input id="abb" value="0"></div><div><label>Spazio foto (mm)</label><input id="spazio" value="2,5"></div><div><label>Margine (mm)</label><input id="margine" value="10"></div>
  </div></div>
  <div class="err" id="err"></div>
  <div class="btns"><button id="cancel">Annulla</button><button class="primary" id="create">Crea</button></div>
</div></div>

<div class="veil" id="vwait"><div class="dlg" style="text-align:center;width:300px"><div class="spin"></div><div id="wmsg">Apro il progetto…</div></div></div>

<script nonce="__NONCE__">
const $ = id => document.getElementById(id);
const GETTONE = (() => { try { return sessionStorage.getItem("impaginatore_gettone") || ""; } catch (e) { return ""; } })();       // gettone delle API: lo lascia nella scheda l'indirizzo di avvio, mai nella pagina né nel cookie (VER-006, docs/architettura/SICUREZZA.md)
if (!GETTONE) { document.body.innerHTML = '<div style="padding:48px;max-width:640px;font:15px/1.5 -apple-system,Segoe UI,sans-serif"><h1 style="font-size:20px">Impaginatore</h1><p>Questa scheda non è collegata al programma.</p><p>Apri Impaginatore dal suo collegamento (o un progetto dalla schermata dei progetti): l\'indirizzo che si apre da lì vale una volta sola e collega questa scheda.</p></div>'; throw new Error("scheda non collegata"); }
const rq = (p, o = {}) => fetch(p, Object.assign({}, o, { headers: Object.assign({ "X-Impaginatore-Gettone": GETTONE }, o.headers || {}) }));
const encU = s => encodeURIComponent(s).replace(/[!'()*]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase());      // anche dentro url('...') dei CSS
let SIS = "";                                                                    // sistema operativo (dal server): «Mostra nel Finder» o in Esplora risorse
const lblFinder = () => ({ mac: "Mostra nel Finder", windows: "Mostra in Esplora risorse" }[SIS] || "Mostra nel gestore file");
async function api(p, b) { const r = await rq(p, b === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); const j = await r.json(); if (j.errore) throw new Error(j.errore); return j; }
const fmtD = t => new Date(t * 1000).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
const cm = v => String(v).replace(".", ",");
let LIST = [];

async function load() {
  const d = await api("/api/progetti"); LIST = d.progetti; SIS = d.sistema || ""; $("where").textContent = "I nuovi progetti vengono salvati in: " + d.cartella;
  const g = $("grid"); g.innerHTML = "";
  const nw = document.createElement("div"); nw.className = "card new"; nw.innerHTML = "<b>+</b><span>Nuovo progetto</span>"; nw.onclick = openNew; g.appendChild(nw);
  LIST.forEach(p => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="cv" ${p.cover ? `style="background-image:url('/api/cover?path=${encU(p.path)}&n=${encU(p.cover)}')"` : ""}>${p.cover ? "" : "nessuna foto"}</div>
      <div class="tx"><div class="nm">${esc(p.nome)}</div><div class="meta">${p.cm ? esc(cm(p.cm[0]) + " × " + cm(p.cm[1])) + " cm · " : ""}${esc(p.spread)} spread · ${esc(p.foto)} foto</div><div class="meta">${p.errore ? "errore: " + esc(p.errore) : "modificato " + fmtD(p.mod)}</div></div>
      ${p.aperto ? '<span class="dot">aperto</span>' : ""}<button class="mn">⋯</button>`;
    c.onclick = e => { if (e.target.classList.contains("mn")) { menu(e, p); return; } openProject(p); };
    g.appendChild(c);
  });
}
const esc = s => String(s ?? "").replace(/[&<>"'`]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" }[c]));      // ogni dato passa da qui prima di innerHTML

function menu(e, p) {
  e.stopPropagation(); const m = $("menu");
  m.innerHTML = `<div data-a="open">Apri</div><div data-a="finder">${lblFinder()}</div>` + (p.esterno ? `<div data-a="rim">Togli dall'elenco</div>` : `<div data-a="cest" class="d">Metti nel Cestino…</div>`);
  m.style.display = "block"; m.style.left = Math.min(e.clientX, innerWidth - 210) + "px"; m.style.top = e.clientY + "px";
  m.onclick = async ev => {
    const a = ev.target.dataset.a; m.style.display = "none"; if (!a) return;
    try {
      if (a === "open") openProject(p);
      else if (a === "finder") await api("/api/finder", { path: p.path });
      else if (a === "rim") { await api("/api/rimuovi", { path: p.path }); load(); }
      else if (a === "cest" && confirm(`Mettere nel Cestino il progetto «${p.nome}» con tutte le sue foto collegate e le anteprime?`)) { await api("/api/cestino", { path: p.path }); load(); }
    } catch (er) { alert(er.message); }
  };
}
document.addEventListener("click", () => $("menu").style.display = "none");

async function openProject(p) {
  $("wmsg").textContent = "Apro «" + p.nome + "»…"; $("vwait").style.display = "flex";
  try {
    const { porta } = await api("/api/apri", { path: p.path });
    for (let i = 0; i < 240; i++) { const r = await api("/api/pronto?porta=" + porta); if (r.pronto) { location.href = r.indirizzo; return; } await new Promise(r => setTimeout(r, 500)); }
    throw new Error("L'editor non si è avviato (guarda Progetti/editor.log)");
  } catch (e) { $("vwait").style.display = "none"; alert(e.message); }
}

// ---- nuovo progetto
const parse = v => parseFloat(String(v).replace(",", "."));
function pinfo() { const w = parse($("w").value), h = parse($("h").value); $("pinfo").textContent = w > 0 && h > 0 ? `Ogni pagina: ${cm(+(w / 2).toFixed(2))} × ${cm(h)} cm` : ""; }
function openNew() { $("err").textContent = ""; $("vnew").style.display = "flex"; $("nome").value = ""; $("fdir").value = ""; $("nome").focus(); pinfo(); }
$("w").oninput = $("h").oninput = pinfo;
document.querySelectorAll(".pre button").forEach(b => b.onclick = () => { const [w, h] = b.dataset.p.split(","); $("w").value = cm(w); $("h").value = cm(h); pinfo(); });
$("advt").onclick = () => { $("adv").classList.toggle("on"); $("advt").textContent = ($("adv").classList.contains("on") ? "▾" : "▸") + " Avanzate (abbondanza, spazio tra le foto, margine)"; };
$("fpick").onclick = async () => { try { const r = await api("/api/scegli-foto", {}); if (r.path) { $("fdir").value = r.path; if (!$("nome").value) $("nome").value = r.path.split(/[\\/]/).filter(Boolean).pop().replace(/\s*JPG$/i, ""); } } catch (e) { $("err").textContent = e.message; } };
$("cancel").onclick = () => $("vnew").style.display = "none";
$("create").onclick = async () => {
  try {
    const r = await api("/api/nuovo", { nome: $("nome").value, foto: $("fdir").value, w: $("w").value, h: $("h").value, abb: $("abb").value, spazio: $("spazio").value, margine: $("margine").value });
    $("vnew").style.display = "none"; await load(); const p = LIST.find(x => x.path === r.path); if (p) openProject(p);
  } catch (e) { $("err").textContent = e.message; }
};
$("nome").onkeydown = e => { if (e.key === "Enter") $("create").onclick(); };
$("addzip").onclick = async () => { const b = $("addzip"); b.disabled = true; b.textContent = "Importo…"; try { const r = await api("/api/importa-zip", {}); if (!r.annullato) load(); } catch (e) { alert(e.message); } b.disabled = false; b.textContent = "Importa ZIP…"; };
$("add").onclick = async () => { try { const r = await api("/api/aggiungi", {}); if (!r.annullato) load(); } catch (e) { alert(e.message); } };
$("quit").onclick = async () => { if (confirm("Chiudere il programma? Le modifiche sono già salvate.")) { try { await api("/api/esci", {}); } catch (e) {} document.body.innerHTML = '<p style="padding:40px;color:#aaa">Programma chiuso. Puoi chiudere questa scheda.</p>'; } };
async function checkUpd() { try { const r = await (await rq("/api/aggiornamento")).json(); showVer(r); const b = $("upd"); b.style.display = "none"; b.title = (r.novita || []).join("\n"); b.dataset.n = (r.novita || []).map(x => "• " + x).join("\n"); } catch (e) {} }
$("upd").onclick = async () => { const b = $("upd"); if (!confirm("Novità:\n" + b.dataset.n + "\n\nAggiorno e riavvio il programma? Il lavoro è già salvato.")) return; b.textContent = "Aggiorno…"; b.disabled = true; try { await api("/api/aggiorna", {}); document.body.innerHTML = '<p style="padding:40px;color:#aaa">Aggiornato: il programma si riapre da solo tra qualche secondo…</p>'; setTimeout(() => location.reload(), 6000); } catch (e) { alert(e.message); b.disabled = false; b.textContent = "⬆ Aggiornamento disponibile"; } };
const nomeV = v => v.rel ? `${v.rel} (build ${v.n})` : `${v.n}`, brev = v => v.rel || v.n;
const fmtV = v => v ? `<b>Versione ${esc(nomeV(v))}</b> · ${esc(v.data)} · ${esc(v.titolo)} <span style="color:var(--dim)">(${esc(v.codice)})</span>` : "—";
function showVer(r) {
  const vb = $("verb"), spenti = r.disponibile === false; vb.className = spenti ? "" : r.errore ? "off" : r.da_aggiornare ? "nuova" : "ok";
  $("vtxt").textContent = !r.attuale ? "Versione ?" : spenti ? `Versione ${brev(r.attuale)}` : r.errore ? `Versione ${brev(r.attuale)} · non riesco a controllare` : r.da_aggiornare ? `Versione ${brev(r.attuale)} · disponibile la ${r.ultima ? brev(r.ultima) : "nuova"} — clicca per aggiornare` : `Versione ${brev(r.attuale)} · aggiornata`;
  const ago = r.controllato ? new Date(r.controllato * 1000).toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" }) : "mai";
  $("vbody").innerHTML = `In uso: ${fmtV(r.attuale)}<br>` + (spenti ? `<span style="color:var(--dim)">${esc(r.motivo || "Aggiornamenti automatici non disponibili")}</span>` : r.errore ? `<span style="color:#e5484d">Non riesco a controllare gli aggiornamenti (internet?)</span>` : r.da_aggiornare ? `Disponibile: ${fmtV(r.ultima)}<br><b>Novità:</b><br>${(r.novita || []).map(x => "• " + esc(x)).join("<br>")}` : `<span style="color:#5cb85c">✓ Hai già l'ultima versione</span>`) + `<br><span style="color:var(--dim);font-size:12px">Ultimo controllo: ${ago}</span>`;
  $("vgo").style.display = r.da_aggiornare ? "" : "none"; $("vchk").style.display = spenti ? "none" : "";
}
$("verb").onclick = async () => { $("vver").style.display = "flex"; try { showVer(await (await rq("/api/aggiornamento")).json()); } catch (e) {} };
$("vhist").onclick = async e => { e.preventDefault(); const L = $("vlist"); if (L.style.display === "block") { L.style.display = "none"; return; } L.style.display = "block"; L.textContent = "…"; try { const r = await (await rq("/api/versioni")).json(); L.innerHTML = ""; r.versioni.forEach(v => { const d = document.createElement("div"); d.style.cssText = "display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)"; d.innerHTML = `<span style="flex:1"><b>Versione ${esc(v.n)}</b> · ${esc(v.data)}<br><span style="color:var(--dim)">${esc(v.titolo)}</span></span>` + (v.attuale ? '<span style="color:#3fb950">in uso</span>' : '<button>Torna a questa</button>'); const b = d.querySelector("button"); if (b) b.onclick = async () => { if (!confirm(`Tornare alla versione ${v.n}?\n\n${v.titolo}\n\nIl programma si riavvia. I tuoi progetti non cambiano. Le versioni successive restano salvate.`)) return; b.textContent = "Ripristino…"; try { const x = await api("/api/ripristina", { codice: v.codice }); document.body.innerHTML = '<p style="padding:40px;color:#aaa">Tornato alla versione ' + esc(x.n) + (x.caricato ? "" : " (solo su questo Mac: non sono riuscito a caricarla su GitHub)") + '. Il programma si riapre da solo…</p>'; setTimeout(() => location.reload(), 6000); } catch (err) { alert(err.message); b.textContent = "Torna a questa"; } }; L.appendChild(d); }); } catch (err) { L.textContent = "Non riesco a leggere le versioni"; } };
$("vclose").onclick = () => $("vver").style.display = "none";
$("vchk").onclick = async () => { const b = $("vchk"); b.disabled = true; b.textContent = "Controllo…"; try { const r = await api("/api/controlla", {}); showVer(r); checkUpd(); } catch (e) { alert(e.message); } b.disabled = false; b.textContent = "Controlla aggiornamenti"; };
$("vgo").onclick = () => { $("vver").style.display = "none"; $("upd").onclick(); };
checkUpd(); api("/api/controlla", {}).then(checkUpd).catch(() => {}); setInterval(checkUpd, 600000);       // aprendo la pagina si controlla subito GitHub, senza aspettare il controllo periodico
load();
</script>

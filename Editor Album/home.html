<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impaginatore</title>
<style>
  :root { --bg: #2b2b2b; --panel: #333; --panel2: #3b3b3b; --line: #4a4a4a; --text: #e6e6e6; --dim: #a0a0a0; --accent: #e0b23c; --accent-ink: #231a00; --danger: #d9605a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  button, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
  button { cursor: pointer; } button:hover { border-color: #777; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 28px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  main { padding: 28px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; }
  .card:hover { border-color: var(--accent); }
  .card .cv { height: 150px; background: #444 center/cover; display: flex; align-items: center; justify-content: center; color: #777; font-size: 12px; }
  .card .tx { padding: 10px 12px 12px; }
  .card .nm { font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { color: var(--dim); font-size: 12px; }
  .card .dot { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--accent); }
  .card .mn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); border: none; padding: 1px 8px; border-radius: 10px; }
  .new { border-style: dashed; display: flex; align-items: center; justify-content: center; min-height: 230px; flex-direction: column; gap: 8px; color: var(--dim); font-size: 15px; }
  .new b { font-size: 40px; font-weight: 300; color: var(--accent); line-height: 1; }
  .empty { color: var(--dim); }
  #menu { position: fixed; background: #222; border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: none; z-index: 20; min-width: 190px; }
  #menu div { padding: 6px 12px; border-radius: 5px; cursor: pointer; } #menu div:hover { background: var(--panel2); } #menu .d { color: var(--danger); }
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 30; }
  .dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; width: 460px; max-width: 92vw; }
  .dlg h3 { margin: 0 0 14px; font-size: 17px; }
  .dlg label { display: block; color: var(--dim); font-size: 12px; margin: 12px 0 4px; }
  .dlg input { width: 100%; } .dlg .two { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; } .dlg .two span { color: var(--dim); }
  .dlg .pre { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; } .dlg .pre button { padding: 3px 9px; font-size: 12px; }
  .dlg .info { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 17px; }
  .dlg .adv { display: none; } .dlg .adv.on { display: block; } .dlg .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .dlg .err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
  .spin { width: 34px; height: 34px; border: 3px solid #555; border-top-color: var(--accent); border-radius: 50%; animation: r 1s linear infinite; margin: 0 auto 12px; } @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Impaginatore</h1>
  <button id="add" title="Apri un progetto che sta in un'altra cartella (quella con progetto.json)">Apri progetto esistente…</button>
  <button id="addzip" title="Importa un progetto esportato come file ZIP (Esporta progetto dall'editor)">Importa ZIP…</button>
  <button id="quit" title="Chiude il programma">Chiudi programma</button>
</header>
<main>
  <h2>Progetti</h2>
  <div class="grid" id="grid"></div>
  <p class="empty" id="where"></p>
</main>

<div id="menu"></div>

<div class="veil" id="vnew"><div class="dlg">
  <h3>Nuovo progetto</h3>
  <label>Nome del progetto</label><input id="nome" placeholder="Es. Battesimo Serena" autofocus>
  <label>Dimensioni dell'album aperto (due pagine), in cm</label>
  <div class="two"><input id="w" inputmode="decimal" placeholder="Larghezza" value="60"><span>×</span><input id="h" inputmode="decimal" placeholder="Altezza" value="22,5"></div>
  <div class="pre"><button data-p="60,22.5">60 × 22,5</button><button data-p="70,25">70 × 25</button><button data-p="50,20">50 × 20</button><button data-p="40,30">40 × 30</button></div>
  <div class="info" id="pinfo"></div>
  <label style="cursor:pointer" id="advt">▸ Avanzate (abbondanza, spazio tra le foto, margine)</label>
  <div class="adv" id="adv"><div class="three">
    <div><label>Abbondanza (mm)</label><input id="abb" value="0"></div><div><label>Spazio foto (mm)</label><input id="spazio" value="2,5"></div><div><label>Margine (mm)</label><input id="margine" value="10"></div>
  </div></div>
  <div class="err" id="err"></div>
  <div class="btns"><button id="cancel">Annulla</button><button class="primary" id="create">Crea</button></div>
</div></div>

<div class="veil" id="vwait"><div class="dlg" style="text-align:center;width:300px"><div class="spin"></div><div id="wmsg">Apro il progetto…</div></div></div>

<script>
const $ = id => document.getElementById(id);
async function api(p, b) { const r = await fetch(p, b === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); const j = await r.json(); if (j.errore) throw new Error(j.errore); return j; }
const fmtD = t => new Date(t * 1000).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
const cm = v => String(v).replace(".", ",");
let LIST = [];

async function load() {
  const d = await api("/api/progetti"); LIST = d.progetti; $("where").textContent = "I nuovi progetti vengono salvati in: " + d.cartella;
  const g = $("grid"); g.innerHTML = "";
  const nw = document.createElement("div"); nw.className = "card new"; nw.innerHTML = "<b>+</b><span>Nuovo progetto</span>"; nw.onclick = openNew; g.appendChild(nw);
  LIST.forEach(p => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="cv" ${p.cover ? `style="background-image:url('/api/cover?path=${encodeURIComponent(p.path)}&n=${encodeURIComponent(p.cover)}')"` : ""}>${p.cover ? "" : "nessuna foto"}</div>
      <div class="tx"><div class="nm">${esc(p.nome)}</div><div class="meta">${p.cm ? cm(p.cm[0]) + " × " + cm(p.cm[1]) + " cm · " : ""}${p.spread} spread · ${p.foto} foto</div><div class="meta">${p.errore ? "errore: " + esc(p.errore) : "modificato " + fmtD(p.mod)}</div></div>
      ${p.aperto ? '<span class="dot">aperto</span>' : ""}<button class="mn">⋯</button>`;
    c.onclick = e => { if (e.target.classList.contains("mn")) { menu(e, p); return; } openProject(p); };
    g.appendChild(c);
  });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function menu(e, p) {
  e.stopPropagation(); const m = $("menu");
  m.innerHTML = `<div data-a="open">Apri</div><div data-a="finder">Mostra nel Finder</div>` + (p.esterno ? `<div data-a="rim">Togli dall'elenco</div>` : `<div data-a="cest" class="d">Metti nel Cestino…</div>`);
  m.style.display = "block"; m.style.left = Math.min(e.clientX, innerWidth - 210) + "px"; m.style.top = e.clientY + "px";
  m.onclick = async ev => {
    const a = ev.target.dataset.a; m.style.display = "none"; if (!a) return;
    try {
      if (a === "open") openProject(p);
      else if (a === "finder") await api("/api/finder", { path: p.path });
      else if (a === "rim") { await api("/api/rimuovi", { path: p.path }); load(); }
      else if (a === "cest" && confirm(`Mettere nel Cestino il progetto «${p.nome}» con tutte le sue foto collegate e le anteprime?`)) { await api("/api/cestino", { path: p.path }); load(); }
    } catch (er) { alert(er.message); }
  };
}
document.addEventListener("click", () => $("menu").style.display = "none");

async function openProject(p) {
  $("wmsg").textContent = "Apro «" + p.nome + "»…"; $("vwait").style.display = "flex";
  try {
    const { porta } = await api("/api/apri", { path: p.path });
    for (let i = 0; i < 240; i++) { if ((await api("/api/pronto?porta=" + porta)).pronto) { location.href = "http://127.0.0.1:" + porta + "/"; return; } await new Promise(r => setTimeout(r, 500)); }
    throw new Error("L'editor non si è avviato (guarda Progetti/editor.log)");
  } catch (e) { $("vwait").style.display = "none"; alert(e.message); }
}

// ---- nuovo progetto
const parse = v => parseFloat(String(v).replace(",", "."));
function pinfo() { const w = parse($("w").value), h = parse($("h").value); $("pinfo").textContent = w > 0 && h > 0 ? `Ogni pagina: ${cm(+(w / 2).toFixed(2))} × ${cm(h)} cm` : ""; }
function openNew() { $("err").textContent = ""; $("vnew").style.display = "flex"; $("nome").value = ""; $("nome").focus(); pinfo(); }
$("w").oninput = $("h").oninput = pinfo;
document.querySelectorAll(".pre button").forEach(b => b.onclick = () => { const [w, h] = b.dataset.p.split(","); $("w").value = cm(w); $("h").value = cm(h); pinfo(); });
$("advt").onclick = () => { $("adv").classList.toggle("on"); $("advt").textContent = ($("adv").classList.contains("on") ? "▾" : "▸") + " Avanzate (abbondanza, spazio tra le foto, margine)"; };
$("cancel").onclick = () => $("vnew").style.display = "none";
$("create").onclick = async () => {
  try {
    const r = await api("/api/nuovo", { nome: $("nome").value, w: $("w").value, h: $("h").value, abb: $("abb").value, spazio: $("spazio").value, margine: $("margine").value });
    $("vnew").style.display = "none"; await load(); const p = LIST.find(x => x.path === r.path); if (p) openProject(p);
  } catch (e) { $("err").textContent = e.message; }
};
$("nome").onkeydown = e => { if (e.key === "Enter") $("create").onclick(); };
$("addzip").onclick = async () => { const b = $("addzip"); b.disabled = true; b.textContent = "Importo…"; try { const r = await api("/api/importa-zip", {}); if (!r.annullato) load(); } catch (e) { alert(e.message); } b.disabled = false; b.textContent = "Importa ZIP…"; };
$("add").onclick = async () => { try { const r = await api("/api/aggiungi", {}); if (!r.annullato) load(); } catch (e) { alert(e.message); } };
$("quit").onclick = async () => { if (confirm("Chiudere il programma? Le modifiche sono già salvate.")) { try { await api("/api/esci", {}); } catch (e) {} document.body.innerHTML = '<p style="padding:40px;color:#aaa">Programma chiuso. Puoi chiudere questa scheda.</p>'; } };
load();
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="tela" content="1080x1350">
<meta name="temi" content="chiaro scuro">
<meta name="lingue" content="it en">
<meta name="zone" content="griglia-3x4">
<meta name="gruppo" content="post">
<meta name="uso" content="Post verticale 4:5 per Instagram e Facebook. Esempio: U01, «Fatto da un fotografo». Titolo fino a tre righe, attacco fino a tre righe, spread con foto dell'album dimostrativo.">
<title>Post verticale</title>
<link rel="stylesheet" href="social.css">
</head>
<body>
<div class="tela crocini" style="--l:1080px;--a:1350px">
  <div class="gabbia" style="--alto:104px;--basso:96px">
    <p class="etichetta"><span lang="it">Fatto da un fotografo</span><span lang="en">Made by a photographer</span></p>
    <h1 class="titolo medio" style="margin-top:28px">
      <span lang="it">Il programma con cui impagino dal 2012 smetterà di aprirsi. Così ne ho fatto uno che <em>resta</em>.</span>
      <span lang="en">The album software I have used since 2012 will stop opening. So I built one that <em>stays</em>.</span>
    </h1>
    <div class="spinta"></div>
    <div class="spread" style="margin-bottom:84px">
      <div class="pagina una"><div class="foto"><img src="../../demo/foto/DEMO_0002.jpg" alt=""></div></div>
      <div class="pagina tre">
        <div class="foto"><img src="../../demo/foto/DEMO_0052.jpg" alt=""></div>
        <div class="foto"><img src="../../demo/foto/DEMO_0015.jpg" alt=""></div>
        <div class="foto"><img src="../../demo/foto/DEMO_0053.jpg" alt=""></div>
      </div>
      <span class="segno-piega su"></span><span class="segno-piega giu"></span>
      <div class="quota-spazio" style="--x0:78.26cqw;--x1:79.10cqw"><span class="valore"><span lang="it">5,0 mm</span><span lang="en">5.0 mm</span></span></div>
    </div>
    <div class="piede">
      <img class="logotipo solo-chiaro" src="../../../brand/logo/impaginatore-logotipo.svg" alt="Impaginatore">
      <img class="logotipo solo-scuro" src="../../../brand/logo/impaginatore-logotipo-negativo.svg" alt="Impaginatore">
      <span class="payoff"><span lang="it">Resta tuo.</span><span lang="en">Yours to keep.</span></span>
    </div>
  </div>
</div>
</body>
</html>

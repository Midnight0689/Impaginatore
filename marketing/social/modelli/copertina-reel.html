<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="tela" content="1080x1920">
<meta name="temi" content="chiaro scuro">
<meta name="lingue" content="it en">
<meta name="zone" content="reel-griglia storia">
<meta name="gruppo" content="video">
<meta name="uso" content="Copertina di un reel o di uno Short, 9:16. Nella griglia del profilo si vede il 3:4 centrale (240 px tagliati sopra e sotto), nel feed l'interfaccia copre 250 px in alto e 340 in basso: il titolo sta fra 300 e 1500 px. Esempio: copione V1.">
<title>Copertina reel</title>
<link rel="stylesheet" href="social.css">
</head>
<body>
<div class="tela" style="--l:1080px;--a:1920px">
  <div class="gabbia" style="--alto:330px;--basso:420px">
    <p class="etichetta accento"><span lang="it">Prova in 30 secondi</span><span lang="en">A 30-second test</span></p>
    <h1 class="titolo" style="margin-top:30px">
      <span lang="it">Stacco il wi‑fi ed esporto l’album.</span>
      <span lang="en">I turn off the wi‑fi and export the album.</span>
    </h1>
    <div class="spinta"></div>
    <div class="spread" style="width:820px;align-self:center">
      <div class="pagina una"><div class="foto"><img src="../../demo/foto/DEMO_0058.jpg" alt=""></div></div>
      <div class="pagina due-o"><div class="foto"><img src="../../demo/foto/DEMO_0059.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0057.jpg" alt=""></div></div>
      <span class="segno-piega su"></span><span class="segno-piega giu"></span>
    </div>
    <div class="spinta"></div>
    <div class="piede">
      <img class="logotipo solo-chiaro" src="../../../brand/logo/impaginatore-logotipo.svg" alt="Impaginatore">
      <img class="logotipo solo-scuro" src="../../../brand/logo/impaginatore-logotipo-negativo.svg" alt="Impaginatore">
      <span class="payoff"><span lang="it">Resta tuo.</span><span lang="en">Yours to keep.</span></span>
    </div>
  </div>
</div>
</body>
</html>

# Controlli di ogni modifica: lint, forma del registro, test sui tre sistemi, copertura con soglia bloccante.
# Ogni passo chiama strumenti/controlli.py, che in locale esegue gli stessi controlli:
#     python strumenti/controlli.py lint | test | copertura | tutto   [--python 3.13]
#
# Matrice: Linux con Python 3.11 (la minima di pyproject.toml), 3.12, 3.13 e 3.14 (3.12 con copertura); macOS 15 (arm64)
# e Windows Server 2025 solo con Python 3.12. Un push nuovo sullo stesso ramo annulla l'esecuzione superata (concurrency).
#
# Tempi reali (esecuzioni del 16/11/2026, cache di uv calda); i job sono paralleli, un'esecuzione dura quanto il più lungo
# (~20 minuti):
#     lint ~15 s + Linux ~15-17 min per job x 4
#     Windows senza browser ~12,5-20 min + browser ~5-6,5 min
#     macOS senza browser ~6,5-7 min + browser ~4-6 min
# Con il repository pubblico i runner standard non consumano minuti del piano. Da privato ogni job si arrotonda al minuto
# intero e Windows conta 2 volte, macOS 10: ~66 + ~27 x 2 + ~13 x 10 = ~250 minuti a esecuzione (~8 al mese con 2.000).
name: CI

on:
  push:
    branches: [main, "prodotto/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# un push nuovo sullo stesso ramo (o sulla stessa PR) annulla l'esecuzione superata di questo workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Python di uv (python-build-standalone) su tutti i sistemi, non quello preinstallato sul runner: stessi interpreti
  # delle prove locali e degli altri sistemi
  UV_PYTHON_PREFERENCE: only-managed

defaults:
  run:
    # bash anche su Windows (Git Bash): stessi comandi sui tre sistemi, niente differenze di PowerShell
    shell: bash

jobs:
  lint:
    name: Lint e registro
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: ruff e forma del registro
        timeout-minutes: 5
        run: uv run --no-project strumenti/controlli.py lint

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.comando == 'copertura' && ', copertura' || '' }}${{ matrix.parte && format(', {0}', matrix.parte) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11", comando: test }
          - { os: ubuntu-24.04, python: "3.12", comando: copertura }
          - { os: ubuntu-24.04, python: "3.13", comando: test }
          - { os: ubuntu-24.04, python: "3.14", comando: test }
          # macOS e Windows in due job paralleli: le prove nel browser (Chrome vero, lente) da una parte, il resto
          # dall'altra; insieme supererebbero i 30 minuti di un job
          # macos-15 e non macos-26: per quattro esecuzioni di fila GitHub non ha assegnato una macchina macos-26 ai job in coda.
          # Si torna a macos-26 quando è disponibile; il difetto dei caratteri visto lì resta coperto da tests/test_motore.py.
          - { os: macos-15, python: "3.12", comando: test, parte: senza browser, marcatori: "not browser" }
          - { os: macos-15, python: "3.12", comando: test, parte: browser, marcatori: browser }
          - { os: windows-2025, python: "3.12", comando: test, parte: senza browser, marcatori: "not browser" }
          - { os: windows-2025, python: "3.12", comando: test, parte: browser, marcatori: browser }
    steps:
      # git per Windows converte i file di testo in CRLF all'estrazione: i test devono leggere gli stessi byte degli
      # altri sistemi (progetti di riferimento in tests/dati, risorse dell'interfaccia)
      - name: Fine riga come nel repository
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # storia intera (pochi MB): test_progetto_si_esporta_per_la_1x legge dalla storia gli script della 1.5.2 (957fdf7)
      # e prova che girano sul progetto esportato; con il solo ultimo commit quella parte si salterebbe
      - name: Codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: uv e Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # «copertura» esegue tutti i test con la misura della copertura e fallisce sotto fail_under (pyproject.toml)
      - name: ${{ matrix.comando == 'copertura' && 'Test con copertura' || 'Test' }}
        timeout-minutes: 25
        env:
          PYTEST_ADDOPTS: ${{ matrix.marcatori && format('-m "{0}"', matrix.marcatori) || '' }}
        run: uv run --no-project strumenti/controlli.py ${{ matrix.comando }}

      - name: Copertura totale nel riepilogo
        if: ${{ !cancelled() && matrix.comando == 'copertura' }}
        timeout-minutes: 2
        run: |
          if [ -f .coverage ]; then
            echo "Copertura totale: $(uv run --locked --extra dev coverage report --format=total --fail-under=0) %" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapporto di copertura
        if: ${{ !cancelled() && matrix.comando == 'copertura' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copertura
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

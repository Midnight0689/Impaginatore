<!doctype html>
<html lang="__LINGUA__" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impaginatore</title>
<link rel="stylesheet" href="/risorse/tokens.css">
<link rel="stylesheet" href="/risorse/font.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--imp-app-tela); color: var(--imp-app-testo); font: 400 13px/1.4 var(--imp-font-testo); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: var(--imp-bordo-fuoco) solid var(--imp-app-accento); outline-offset: 2px; }
  .num { font-family: var(--imp-font-numeri); font-size: 12px; }
  .tenue { color: var(--imp-app-testo-tenue); }

  /* pulsanti: raggio 4 px, uno solo primario per schermata */
  button { height: 28px; padding: 0 12px; border: 1px solid var(--imp-app-bordo); border-radius: var(--imp-raggio-medio); background: var(--imp-app-sollevato); color: var(--imp-app-testo); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background var(--imp-durata-breve), border-color var(--imp-durata-breve); }
  button:hover:not(:disabled) { border-color: var(--imp-bordo-campo); background: var(--imp-app-pannello); }
  button:disabled { opacity: .55; cursor: default; }
  button.primario { background: var(--imp-accento-fondo); border-color: var(--imp-accento-fondo); color: var(--imp-su-accento); font-weight: 600; }
  button.primario:hover:not(:disabled) { background: var(--imp-accento-fondo-premuto); border-color: var(--imp-accento-fondo-premuto); }
  button.pericolo { background: var(--imp-errore); border-color: var(--imp-errore); color: var(--imp-su-accento); font-weight: 600; }
  button.icona { width: 28px; padding: 0; font-size: 15px; line-height: 1; }
  button.link { height: auto; min-height: 24px; padding: 2px 0; border: 0; background: none; color: var(--imp-app-testo-tenue); font-weight: 400; }
  button.link:hover:not(:disabled) { background: none; color: var(--imp-app-testo); }
  input, textarea { width: 100%; height: 28px; padding: 0 8px; border: 1px solid var(--imp-bordo-campo); border-radius: var(--imp-raggio-medio); background: var(--imp-app-tela); }
  input::placeholder, textarea::placeholder { color: var(--imp-app-testo-tenue); }
  textarea { height: auto; padding: 6px 8px; font-family: var(--imp-font-numeri); font-size: 12px; resize: vertical; }

  /* barra */
  .barra { position: sticky; top: 0; z-index: 5; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 24px; background: var(--imp-app-barra); border-bottom: 1px solid var(--imp-app-bordo); }
  .marchio { margin: 0 auto 0 0; font: 500 18px/1 var(--imp-font-titoli); letter-spacing: -.006em; }
  #cerca { width: 220px; }
  #verb { display: inline-flex; align-items: center; gap: 8px; border-color: transparent; background: none; color: var(--imp-app-testo-tenue); font-weight: 400; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  #verb:hover:not(:disabled) { background: var(--imp-app-pannello); border-color: var(--imp-app-bordo); }
  #verb i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--imp-app-testo-tenue); }
  #verb.ok i { background: var(--imp-successo); } #verb.nuova i { background: var(--imp-attenzione-segno); } #verb.off i { background: var(--imp-errore); }
  #lic.warn { border-color: var(--imp-attenzione); color: var(--imp-attenzione); }

  main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 64px; }

  /* riga per creare un album */
  .nuova { display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 12px 20px; border: 1px dashed var(--imp-bordo-campo); border-radius: var(--imp-raggio-grande); }
  .nuova .tx { flex: 1; min-width: 0; }
  .nuova b { display: block; font-size: 15px; font-weight: 500; }
  .nuova span { color: var(--imp-app-testo-tenue); }

  /* scaffale */
  .scaffale { --colonne: 96px minmax(0, 1fr) 104px 64px 64px 200px 156px; margin-top: 24px; }
  .testata, .riga { display: grid; grid-template-columns: var(--colonne); column-gap: 16px; align-items: center; }
  .testata { padding: 0 12px 8px; border-bottom: 1px solid var(--imp-app-bordo); color: var(--imp-app-testo-tenue); font-size: 12px; }
  .testata .d, .riga .d { text-align: right; }
  .riga { position: relative; height: 80px; padding: 0 12px; border-bottom: 1px solid var(--imp-app-bordo); border-radius: var(--imp-raggio-medio); cursor: default; }
  .riga:hover, .riga:focus-within { background: var(--imp-app-pannello); }
  .riga:focus-visible { outline-offset: -2px; }
  .riga .mini { width: 96px; height: 56px; border: 1px solid var(--imp-app-bordo); border-radius: var(--imp-raggio-piccolo); background: var(--imp-app-sollevato) center / cover no-repeat; }
  .riga .nome { font: 500 16px/1.25 var(--imp-font-titoli); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .riga .dove { margin-top: 2px; color: var(--imp-app-testo-tenue); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .riga .st { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
  .riga .st i { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--imp-app-testo-tenue); }
  .riga .st.aperto i { background: var(--imp-successo); } .riga .st.senza i { background: var(--imp-attenzione-segno); } .riga .st.errore i { background: var(--imp-errore); }
  .riga .st small { display: block; color: var(--imp-app-testo-tenue); font-size: 12px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .riga .mod { color: var(--imp-app-testo-tenue); }
  .riga .az { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: none; gap: 6px; padding-left: 12px; background: var(--imp-app-pannello); }
  .riga:hover .az, .riga:focus-within .az { display: flex; }
  .riga:hover .mod, .riga:focus-within .mod { visibility: hidden; }
  .nessuno { padding: 32px 12px; color: var(--imp-app-testo-tenue); }
  .dove-salva { margin: 16px 12px 0; color: var(--imp-app-testo-tenue); font-size: 12px; }

  /* stato vuoto */
  .vuoto { max-width: 520px; margin: 72px auto 0; text-align: center; }
  .vuoto h2 { margin: 0 0 8px; font: 500 28px/1.15 var(--imp-font-titoli); letter-spacing: -.01em; }
  .vuoto p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: var(--imp-app-testo-tenue); }
  .vuoto .secondario { margin-top: 12px; }

  /* riga in basso, solo negli ultimi 7 giorni di prova */
  .prova { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--imp-app-barra); border-top: 1px solid var(--imp-app-bordo); }
  .prova span { color: var(--imp-attenzione); font-weight: 500; }
  body.con-prova main { padding-bottom: 80px; }
  #credit { position: fixed; right: 18px; bottom: 12px; z-index: 6; font: 400 12px/1.3 var(--imp-font-numeri); color: var(--imp-app-testo-tenue); pointer-events: none; user-select: none; }

  /* T-207: avviso di una versione nuova (filetto sinistro e fondo tinto, come gli avvisi della marca) */
  .agg-nuova { display: flex; align-items: flex-start; gap: 16px; margin: 0 0 16px; padding: 12px 16px; border: 1px solid var(--imp-app-bordo); border-left: 3px solid var(--imp-app-accento); border-radius: var(--imp-raggio-grande); background: color-mix(in srgb, var(--imp-app-accento) 9%, var(--imp-app-pannello)); }
  .agg-nuova .tx { flex: 1; min-width: 0; }
  .agg-nuova b { display: block; font-size: 14px; font-weight: 600; }
  .agg-nuova ul { margin: 6px 0; padding-left: 18px; line-height: 1.5; } .agg-nuova ul:empty { display: none; }
  .agg-nuova .nota { color: var(--imp-app-testo-tenue); font-size: 12px; }
  .agg-nuova .az { display: flex; flex: none; align-items: center; gap: 12px; }

  /* menu */
  #menu { position: fixed; z-index: 20; display: none; min-width: 200px; padding: 4px; border: 1px solid var(--imp-app-bordo); border-radius: var(--imp-raggio-grande); background: var(--imp-app-sollevato); box-shadow: var(--imp-ombra-sollevato); }
  #menu button { display: block; width: 100%; height: 28px; padding: 0 12px; border: 0; background: none; font-weight: 400; text-align: left; border-radius: var(--imp-raggio-piccolo); }
  #menu button:hover, #menu button:focus-visible { background: var(--imp-app-pannello); outline-offset: -2px; }
  #menu button.pericolo { color: var(--imp-errore); background: none; font-weight: 400; }
  #menu hr { margin: 4px 0; border: 0; border-top: 1px solid var(--imp-app-bordo); }

  /* finestre */
  .velo { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; background: color-mix(in srgb, var(--imp-carta-950) 60%, transparent); }
  #vchiedi { z-index: 40; } #vwait { z-index: 50; }
  .dlg { width: 480px; max-width: 100%; max-height: 100%; overflow: auto; padding: 24px; border: 1px solid var(--imp-app-bordo); border-radius: var(--imp-raggio-grande); background: var(--imp-app-sollevato); box-shadow: var(--imp-ombra-sollevato); }
  .dlg h3 { margin: 0 0 16px; font: 500 20px/1.2 var(--imp-font-titoli); }
  .dlg label { display: block; margin: 16px 0 4px; color: var(--imp-app-testo-tenue); font-size: 12px; }
  .dlg .due { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .dlg .foto { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .dlg .tre { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dlg .pre { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .dlg .pre button { height: 24px; padding: 0 8px; font-family: var(--imp-font-numeri); font-size: 12px; font-weight: 400; }
  .dlg .info { min-height: 17px; margin-top: 8px; color: var(--imp-app-testo-tenue); font-size: 12px; }
  .dlg select { width: 100%; height: 28px; padding: 0 8px; font: inherit; color: inherit; border: 1px solid var(--imp-bordo-campo); border-radius: var(--imp-raggio-medio); background: var(--imp-app-tela); }   /* prodotto del laboratorio (T-208) */
  .dlg .avanzate { display: none; } .dlg .avanzate.on { display: block; }
  .dlg .err { min-height: 16px; margin-top: 12px; color: var(--imp-errore); font-size: 12px; }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .dlg .corpo { line-height: 1.7; }
  .dlg label.interr { display: flex; align-items: center; gap: 10px; min-height: 28px; margin: 20px 0 0; color: var(--imp-app-testo); font-size: 14px; cursor: pointer; }
  .dlg label.interr input { width: 18px; height: 18px; margin: 0; accent-color: var(--imp-accento); }
  .dlg .corpo .ok { color: var(--imp-successo); } .dlg .corpo .ko { color: var(--imp-errore); }
  .dlg .testo { white-space: pre-line; line-height: 1.5; }
  .vers { display: none; max-height: 220px; overflow: auto; margin-top: 8px; }
  .vers > div { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--imp-app-bordo); }
  .vers > div > span:first-child { flex: 1; }
  .attesa { width: 300px; text-align: center; }
  .spin { width: 32px; height: 32px; margin: 0 auto 12px; border: 3px solid var(--imp-app-bordo); border-top-color: var(--imp-app-accento); border-radius: 50%; animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 6s; } }

  /* avvisi: gli errori restano finché non si leggono */
  #avviso { position: fixed; left: 50%; bottom: 56px; z-index: 60; display: none; align-items: center; gap: 12px; max-width: min(640px, calc(100% - 32px)); padding: 10px 12px 10px 16px; transform: translateX(-50%); border: 1px solid var(--imp-app-bordo); border-radius: var(--imp-raggio-grande); background: var(--imp-app-sollevato); box-shadow: var(--imp-ombra-sollevato); }
  #avviso.errore { border-color: var(--imp-errore); } #avviso.ok { border-color: var(--imp-successo); }
  #avviso span { min-width: 0; overflow-wrap: anywhere; }
  .solo { max-width: 640px; padding: 48px; line-height: 1.5; font-size: 15px; } .solo h1 { margin: 0 0 16px; font: 500 22px/1.2 var(--imp-font-titoli); }

  @media (max-width: 1100px) { .scaffale { --colonne: 96px minmax(0, 1fr) 104px 200px 156px; } .c-sp, .c-fo { display: none; } #verb { max-width: 180px; } }
  @media (max-width: 760px) { .scaffale { --colonne: 96px minmax(0, 1fr) 170px; } .c-fm, .c-md { display: none; } .barra { padding: 0 12px; gap: 6px; } #cerca { width: 120px; } }

  /* statistiche d'uso (T-204): domanda del consenso, impostazioni, registro */
  .dlg.stat { width: 560px; } .dlg.stat .corpo { line-height: 1.5; } .dlg.stat .corpo p { margin: 0 0 10px; } .dlg.stat ul { margin: 4px 0 10px; padding-left: 20px; }
  .dlg.stat .info.testo { white-space: pre-line; } #sregt { height: 280px; white-space: pre; overflow: auto; } .dlg .btns.sx { justify-content: flex-start; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="barra">
  <h1 class="marchio">Impaginatore</h1>
  <input id="cerca" type="search" autocomplete="off" hidden data-t-ph="home.cerca" data-t-aria="home.cerca">
  <button id="verb" type="button" data-t-title="home.versione_titolo"><i id="vdot"></i><span id="vtxt"></span></button>
  <button id="upd" type="button" hidden></button>
  <button id="lic" type="button" data-t-title="home.licenza_titolo"></button>
  <button id="tema" type="button" class="icona" aria-label="" title=""><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 1.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor"/></svg></button>
  <button id="bnuovo" type="button" data-azione="nuovo" data-t="home.nuovo_album"></button>
  <button id="altro" type="button" class="icona" aria-haspopup="menu" data-t-aria="home.altre_azioni" data-t-title="home.altre_azioni">⋯</button>
</header>
<main>
  <section class="agg-nuova" id="aggav" hidden aria-labelledby="aggav-t"><!-- T-207: versione nuova -->
    <div class="tx"><b id="aggav-t"></b><ul id="aggav-l"></ul><span class="nota" id="aggav-n" data-t="home.agg_avviso_nota"></span></div>
    <div class="az"><button id="aggav-dopo" type="button" class="link" data-t="home.agg_piu_tardi"></button><button id="aggav-ok" type="button" class="primario" data-t="home.agg_ok"></button></div>
  </section>
  <div class="nuova" id="nuova">
    <div class="tx"><b data-t="home.crea_titolo"></b><span data-t="home.crea_frase"></span></div>
    <button id="scegli" type="button" data-t="home.scegli_cartella"></button>
  </div>
  <section class="scaffale" id="scaffale" aria-labelledby="titolo-album">
    <h2 id="titolo-album" hidden data-t="home.titolo"></h2>
    <div class="testata" aria-hidden="true"><span></span><span data-t="home.col_album"></span><span class="c-fm" data-t="home.col_formato"></span><span class="c-sp d" data-t="home.col_spread"></span><span class="c-fo d" data-t="home.col_foto"></span><span data-t="home.col_stato"></span><span class="c-md" data-t="home.col_modificato"></span></div>
    <div id="grid" role="list"></div>
    <p class="nessuno" id="nessuno" hidden data-t="home.nessun_risultato"></p>
  </section>
  <div class="vuoto" id="vuoto" hidden>
    <h2 data-t="home.vuoto_titolo"></h2>
    <p data-t="home.vuoto_testo"></p>
    <button id="vuoto-scegli" type="button" class="primario" data-t="home.scegli_cartella"></button>
    <div class="secondario"><button id="vuoto-nuovo" type="button" class="link" data-t="home.vuoto_senza_foto"></button></div>
  </div>
  <p class="dove-salva" id="where"></p>
</main>

<div class="prova" id="prova" hidden><span id="provatxt"></span><button id="provalic" type="button" data-t="home.prova_licenza"></button></div>

<div id="menu" role="menu"></div>
<div id="avviso" role="status" aria-live="polite"><span id="avvtxt"></span><button id="avvchiudi" type="button" class="icona" aria-label="" data-t-aria="comune.chiudi" data-t-title="comune.chiudi">✕</button></div>

<div class="velo" id="vver"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="vver-t">
  <h3 id="vver-t" data-t="home.versione_dlg"></h3>
  <div id="vbody" class="corpo"></div>
  <label class="interr" id="vautor" hidden><input type="checkbox" id="vauto" role="switch"><span data-t="home.agg_automatico"></span></label>
  <div style="margin-top:12px"><button id="vhist" type="button" class="link" aria-expanded="false"></button><div id="vlist" class="vers"></div></div>
  <div class="btns"><button id="vchk" type="button" data-t="home.controlla_aggiornamenti"></button><button id="vgo" type="button" class="primario" style="display:none" data-t="home.aggiorna_ora"></button><button id="vclose" type="button" data-t="comune.chiudi"></button></div>
</div></div>

<div class="velo" id="vnew"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="vnew-t">
  <h3 id="vnew-t" data-t="home.nuovo_titolo"></h3>
  <label for="nome" data-t="home.nome_label"></label><input id="nome" data-t-ph="home.nome_ph" autocomplete="off">
  <label for="fdir" data-t="home.foto_label"></label>
  <div class="foto"><input id="fdir" readonly data-t-ph="home.foto_ph"><button id="fpick" type="button" data-t="home.scegli"></button></div>
  <label for="prod" data-t="home.prodotto_label"></label>
  <select id="prod"></select>
  <div class="info" id="prodi"></div>
  <button id="pimp" type="button" class="link" data-t="home.importa_catalogo"></button>
  <label for="w" data-t="home.dim_label"></label>
  <div class="due"><input id="w" class="num" inputmode="decimal" value="60" data-t-aria="home.larghezza" data-t-ph="home.larghezza"><span class="tenue">×</span><input id="h" class="num" inputmode="decimal" value="22.5" data-t-aria="home.altezza" data-t-ph="home.altezza"></div>
  <div class="pre"><button type="button" data-p="60,22.5"></button><button type="button" data-p="70,25"></button><button type="button" data-p="50,20"></button><button type="button" data-p="40,30"></button></div>
  <div class="info num" id="pinfo"></div>
  <button id="advt" type="button" class="link" aria-expanded="false" aria-controls="adv"></button>
  <div class="avanzate" id="adv"><div class="tre">
    <div><label for="abb" data-t="home.abbondanza"></label><input id="abb" class="num" value="0"></div>
    <div><label for="spazio" data-t="home.spazio_foto"></label><input id="spazio" class="num" value="2.5"></div>
    <div><label for="margine" data-t="home.margine"></label><input id="margine" class="num" value="10"></div>
  </div></div>
  <div class="err" id="err" role="alert"></div>
  <div class="btns"><button id="cancel" type="button" data-t="comune.annulla"></button><button id="create" type="button" class="primario" data-t="home.crea"></button></div>
</div></div>

<div class="velo" id="vlic"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="vlic-t">
  <h3 id="vlic-t" data-t="home.licenza_dlg"></h3>
  <div id="lstato" class="corpo"></div>
  <label for="lkey" data-t="home.lic_chiave_label"></label>
  <textarea id="lkey" rows="4" spellcheck="false" autocomplete="off" placeholder="IMP1-…"></textarea>
  <div class="info" data-t="home.lic_senza_internet"></div>
  <div class="err" id="lerr" role="alert"></div>
  <div class="btns"><button id="lrim" type="button" style="display:none" data-t="home.lic_togli"></button><button id="lclose" type="button" data-t="comune.chiudi"></button><button id="lgo" type="button" class="primario" data-t="home.lic_attiva"></button></div>
</div></div>

<div class="velo" id="vassist"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="vassist-t">
  <h3 id="vassist-t" data-t="home.assist_titolo"></h3>
  <div class="corpo" data-t="home.assist_testo"></div>
  <label class="interr" id="aimgr"><input type="checkbox" id="aimg" role="switch" aria-describedby="anota"><span data-t="home.assist_immagini"></span></label>
  <div class="info" id="anota" data-t="home.assist_nota"></div>
  <div class="info" id="aopz" data-t="home.assist_opzione"></div>
  <div class="info" id="amotivo" hidden></div>
  <div class="err" id="aerr" role="alert"></div>
  <div class="btns"><button id="aclose" type="button" class="primario" data-t="comune.chiudi"></button></div>
</div></div>

<div class="velo" id="vlingua"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="vlingua-t">
  <h3 id="vlingua-t" data-t="home.lingua_titolo"></h3>
  <div id="lingue" role="radiogroup" aria-labelledby="vlingua-t"></div>
  <div class="info" data-t="home.lingua_nota"></div>
  <div class="err" id="lgerr" role="alert"></div>
  <div class="btns"><button id="lgclose" type="button" class="primario" data-t="comune.chiudi"></button></div>
</div></div>

<script nonce="__NONCE__">

const rq = (p, o = {}) => fetch(p, Object.assign({}, o, { headers: Object.assign({ "X-Impaginatore-Gettone": GETTONE }, o.headers || {}) }));
let SIS = "";                                                                    // sistema operativo (dal server): «Mostra nel Finder» o in Esplora risorse

async function api(p, b) { const r = await rq(p, b === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); const j = await r.json(); if (j.errore) throw new Error(j.errore); return j; }
const parse = v => parseFloat(String(v).replace(",", "."));

let LIST = [], VISTI = [], FILTRO = "", CARTELLA = "";

// ---- avvisi in pagina (mai alert): l'errore resta finché non lo chiudi
let _avvT = 0;
function avviso(testo, tipo = "info") {

$("avvchiudi").onclick = () => { clearTimeout(_avvT); $("avviso").style.display = "none"; };

// ---- finestre: Esc chiude, il fuoco torna dove era, Tab resta dentro
const PILA = [];
const focalizzabili = r => [...r.querySelectorAll('button, input, select, textarea, [tabindex="0"]')].filter(e => !e.disabled && e.offsetParent !== null);
function apri(id, fuoco) {
  const v = $(id); PILA.push({ id, origine: document.activeElement }); v.style.display = "flex";
  const f = fuoco || focalizzabili(v.firstElementChild)[0]; if (f) f.focus();

function chiudi(id) {

// ---- menu
let _menuOrigine = null;
function chiudiMenu(riporta) { const m = $("menu"); if (m.style.display !== "block") return; m.style.display = "none"; if (riporta && _menuOrigine && _menuOrigine.isConnected) _menuOrigine.focus(); _menuOrigine = null; }

    if (v === "-") { m.appendChild(document.createElement("hr")); return; }
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "menuitem"); b.textContent = v.testo; if (v.pericolo) b.className = "pericolo";

  m.style.left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8)) + "px"; m.style.top = (r.bottom + 4 + mh > innerHeight ? Math.max(8, r.top - 4 - mh) : r.bottom + 4) + "px";

// ---- scaffale
function fmtMod(ts) {
  if (!ts) return "—"; const d = new Date(ts * 1000), n = new Date(), ora = d.toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" });
  const g = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((g(n) - g(d)) / 86400000);
  if (diff === 0) return t("home.oggi", { ora }); if (diff === 1) return t("home.ieri", { ora });
  return d.toLocaleDateString(LOCALE, d.getFullYear() === n.getFullYear() ? { day: "2-digit", month: "2-digit" } : { day: "2-digit", month: "2-digit", year: "numeric" });
}
function statoDi(p) {

  if (p.aperto) return { c: "aperto", t: t("home.stato_aperto") };

}
function disegna() {
  const tutti = LIST.length, ricerca = tutti > 12; if (!ricerca) FILTRO = "";

// ---- prodotti dei laboratori (T-208): il prodotto dà formato e abbondanza; i testi dei cataloghi restano testo (textContent, Option)
let CAT = [];
async function cataloghi() {
  try { CAT = (await api("/api/cataloghi")).cataloghi; } catch (e) { CAT = []; }

  pinfo();
}

async function riapriQuandoPronto() {                                            // il programma si chiude e si rilancia sulla stessa porta (stesso gettone): si ricarica quando risponde di nuovo
  const ping = async () => { try { return (await rq("/api/ping", { cache: "no-store" })).ok; } catch (e) { return false; } };
  const pausa = ms => new Promise(r => setTimeout(r, ms));

// ---- statistiche d'uso (T-204): spente di serie; con la licenza beta la domanda al primo avvio; il registro si legge, si esporta, si cancella
let STAT = null, _statChiesta = false, _sc = null;
const kB = b => fN(Math.max(0.1, (b || 0) / 1024), 1);
async function caricaStatistiche() { try { STAT = await api("/api/statistiche"); } catch (e) { STAT = null; } return STAT; }
function vociStatistiche() { return STAT && STAT.disponibili ? [{ testo: t("statistiche.menu"), fn: apriStatistiche }] : []; }
function consensoStatistiche() {                                                      // true «Sì, condividi», false «No, grazie», null con Esc (si richiede la volta dopo)
  if (_sc) sceltaStatistiche(null);
  $("sc-dove").textContent = STAT && STAT.invio.attivo ? t("statistiche.dove_invio", { server: STAT.invio.server }) : t("statistiche.dove_manuale");
  return new Promise(ok => { _sc = ok; apri("vstatc", $("sc-no")); });
}
function sceltaStatistiche(v) { const f = _sc; _sc = null; chiudi("vstatc"); if (f) f(v); }
$("sc-si").onclick = () => sceltaStatistiche(true); $("sc-no").onclick = () => sceltaStatistiche(false);
$("vstatc").addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); sceltaStatistiche(null); } });
async function chiediStatistiche() {
  if (_statChiesta || !(await caricaStatistiche()) || !STAT.chiedere) return;
  _statChiesta = true; const v = await consensoStatistiche(); if (v === null) return;
  try { STAT = await api("/api/statistiche/consenso", { si: v }); if (v) avviso(t("statistiche.grazie"), "ok"); } catch (e) { errore(e); }
}
function mostraStatistiche() {
  const s = STAT, r = [s.attive ? (s.eventi ? tn("statistiche.eventi", s.eventi, { kb: kB(s.byte) }) : t("statistiche.registro_vuoto")) : t("statistiche.spente")];
  if (!s.attive && s.eventi) r.push(tn("statistiche.eventi", s.eventi, { kb: kB(s.byte) }));
  r.push(s.id ? t("statistiche.codice", { id: s.id }) : t("statistiche.codice_nessuno"));
  if (s.serie != null) r.push(t("statistiche.seriale_info", { serie: s.serie }));
  r.push(s.invio.attivo ? t("statistiche.invio_auto", { server: s.invio.server, kb: kB(s.invio.in_coda) }) : t("statistiche.invio_manuale"));
  $("sint").checked = s.attive; $("sinfo").textContent = r.join("\n");
  $("sregb").disabled = $("sesp").disabled = $("scanc").disabled = !s.eventi; $("sazz").disabled = !s.id;
}

$("sint").onchange = async () => {
  const v = $("sint").checked; $("serr").textContent = "";
  if (v && await consensoStatistiche() !== true) { $("sint").checked = false; return; }          // accenderle passa sempre dalla domanda, con tutto quello che c'è da sapere
  try { STAT = await api("/api/statistiche/consenso", { si: v }); mostraStatistiche(); } catch (e) { $("sint").checked = !v; erroreStat(e); }

};

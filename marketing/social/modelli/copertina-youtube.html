<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="tela" content="2560x1440">
<meta name="lingue" content="it en">
<meta name="zone" content="youtube-banner">
<meta name="gruppo" content="copertine">
<meta name="uso" content="Banner del canale YouTube, 2560 × 1440. Su telefono e computer si vede solo il centro 1546 × 423: lì stanno logo, payoff e la riga di testo. Il resto si vede sui televisori.">
<title>Copertina YouTube</title>
<link rel="stylesheet" href="social.css">
<style>
  .fascia { position: absolute; left: 0; right: 0; top: 0; height: 440px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .fascia.giu { top: auto; bottom: 0; }
  .centro { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1480px; height: 400px; display: flex; align-items: center; justify-content: space-between; gap: 64px; }
  .centro .logotipo { height: 112px; }
  .centro .destra { text-align: right; display: grid; gap: 18px; }
  .centro .payoff { font-size: 92px; line-height: 1; }
  .centro .testo { font-size: 40px; }
</style>
</head>
<body>
<div class="tela" style="--l:2560px;--a:1440px">
  <div class="fascia">
    <div class="foto"><img src="../../demo/foto/DEMO_0001.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0005.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0018.jpg" alt=""></div>
    <div class="foto"><img src="../../demo/foto/DEMO_0021.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0023.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0043.jpg" alt=""></div>
  </div>
  <div class="fascia giu">
    <div class="foto"><img src="../../demo/foto/DEMO_0052.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0053.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0057.jpg" alt=""></div>
    <div class="foto"><img src="../../demo/foto/DEMO_0058.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0060.jpg" alt=""></div><div class="foto"><img src="../../demo/foto/DEMO_0062.jpg" alt=""></div>
  </div>
  <div class="centro">
    <img class="logotipo" src="../../../brand/logo/impaginatore-logotipo.svg" alt="Impaginatore">
    <div class="destra">
      <span class="payoff"><span lang="it">Resta tuo.</span><span lang="en">Yours to keep.</span></span>
      <p class="testo"><span lang="it">Impaginare album sul tuo computer: guide, prove, mestiere.</span><span lang="en">Laying out albums on your computer: guides, tests, craft.</span></p>
    </div>
  </div>
</div>
</body>
</html>

# Pacchetti di installazione (T-302): programma compilato con Nuitka e pacchetto per ogni sistema, provati davvero.
#     macOS arm64 e Intel   Impaginatore-<v>-mac-arm64.dmg, -mac-x86_64.dmg   (firma ad hoc, senza notarizzazione)
#     Windows               Impaginatore-<v>-windows.exe                       (Inno Setup, per l'utente, senza firma)
#     Linux                 Impaginatore-<v>-linux.deb                         (Ubuntu 24.04 e derivate)
# Come e perché: docs/architettura/DISTRIBUZIONE.md. In locale lo stesso giro è
#     python strumenti/compila.py  e  python strumenti/verifica_pacchetto.py <eseguibile> --finestra
#
# Quando parte e quali pacchetti fa (un giro costa: vedi «Consumo» sotto; i minuti macOS valgono 10, Windows 2):
#     tag v*                         tutti e quattro, dopo i test, con la wheel: è il giro di un rilascio
#     avvio manuale                  quelli scelti (di serie solo Linux), dopo i test, con la wheel; vale solo quando il
#                                    file è sul ramo principale (Actions > Pacchetti > Run workflow)
#     push su pacchetti/<chiave>     un solo pacchetto, senza test né wheel: pacchetti/linux, pacchetti/windows,
#                                    pacchetti/mac-arm64, pacchetti/mac-x86_64; pacchetti/tre = Linux, Mac chip Apple e
#                                    Windows; pacchetti/tutti e pacchetti/prova = tutti e quattro; ogni altro
#                                    pacchetti/** = solo Linux
# Un push nuovo sullo stesso ramo di prova annulla il giro precedente (sui tag mai). NON pubblica niente: i pacchetti
# restano come artefatti dell'esecuzione (30 giorni sui tag, 7 altrimenti). La release si prepara e si firma sul computer
# di chi pubblica con strumenti/rilascio.py: la chiave privata dei rilasci non entra mai qui. Nessun segreto, permessi in
# sola lettura. Il repository è pubblico, e con lui registri e artefatti: nell'artefatto vanno solo il pacchetto (con
# impronta ed elenco dei componenti) e il riepilogo della verifica (rapporto e fotografie della finestra); la diagnosi
# di un controllo che non va resta nel registro del job.
#
# Sui tag e con l'avvio manuale prima i test (gli stessi di ci.yml: copertura su Linux, test su macOS e Windows), che
# devono passare; sui rami pacchetti/** i test non girano (li fa ci.yml sui rami prodotto/**) e si compila subito. Poi un
# job per pacchetto: compila, impacchetta, installa il pacchetto come farebbe un utente (apt, l'installatore silenzioso,
# il DMG montato) e avvia il programma installato con strumenti/verifica_pacchetto.py --finestra: schermata di avvio con
# lo stato della licenza, schermata, editor, esportazioni JPG e PDF, progetto 1.x, PSD fino a Photoshop, server MCP,
# chiusura e la finestra vera, con la schermata Album caricata dentro (Linux dentro xvfb, con le fotografie giudicate;
# macOS e Windows nella sessione grafica del runner, con la fotografia dello schermo come documento). Esiti, tempi e
# misure nel riepilogo dell'esecuzione; rapporto e fotografie nell'artefatto.
#
# Cache: uv (ruote, e su Mac Intel la cryptography costruita dal sorgente) e Nuitka (NUITKA_CACHE_DIR: ccache su Linux e
# macOS, clcache di Nuitka su Windows). La cache di Nuitka si salva subito dopo la compilazione, anche se dopo qualcosa
# non va: la compilazione successiva rifà solo i file C cambiati.
#
# Consumo: il repository è pubblico, i runner standard non si pagano. Tempi misurati e costo se tornasse privato in
# DISTRIBUZIONE.md («Pipeline», «Consumo»). Ogni job ha un tempo massimo per sistema, perché un blocco non tenga
# occupato un runner per ore.
name: Pacchetti

on:
  workflow_dispatch:
    inputs:
      pacchetti:
        description: "Pacchetti da costruire: linux, windows, mac-arm64, mac-x86_64, tre (Linux, Mac chip Apple, Windows) o tutti"
        type: choice
        options: [linux, windows, mac-arm64, mac-x86_64, tre, tutti]
        default: linux
  push:
    tags: ["v*"]
    branches: ["pacchetti/**"]      # prova dei pacchetti senza tag, un sistema per ramo (sopra)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_PYTHON_PREFERENCE: only-managed
  UV_PROJECT_ENVIRONMENT: .venv-compilazione
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  CCACHE_MAXSIZE: 2G
  # compila.py e la prova scrivono UTF-8 anche su Windows (senza, nel registro «non è» diventa «non �»). Il programma
  # compilato non legge le variabili PYTHON*: la modalità UTF-8 la prende da Nuitka (compila.argomenti_nuitka)
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    # obbligatori sui tag e con l'avvio manuale; sui rami pacchetti/** no (sotto, «pacchetto» e «wheel»). Linux sempre
    # (con la copertura), macOS e Windows solo se fra i pacchetti scelti c'è il loro (sui tag tutti e tre)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON('{"tag":["ubuntu-24.04","macos-15-intel","windows-2025"],"tutti":["ubuntu-24.04","macos-15-intel","windows-2025"],"tre":["ubuntu-24.04","macos-15-intel","windows-2025"],"linux":["ubuntu-24.04"],"windows":["ubuntu-24.04","windows-2025"],"mac-arm64":["ubuntu-24.04","macos-15-intel"],"mac-x86_64":["ubuntu-24.04","macos-15-intel"]}')[startsWith(github.ref, 'refs/tags/') && 'tag' || inputs.pacchetti] || fromJSON('["ubuntu-24.04","macos-15-intel","windows-2025"]') }}
    env:
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - name: Fine riga come nel repository
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv e Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lint
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: uv run --no-project strumenti/controlli.py lint

      - name: ${{ runner.os == 'Linux' && 'Test con copertura' || 'Test' }}
        timeout-minutes: 40
        run: uv run --no-project strumenti/controlli.py ${{ runner.os == 'Linux' && 'copertura' || 'test' }}

  pacchetto:
    name: Pacchetto ${{ matrix.chiave }}
    needs: test
    # test passati, oppure (solo sui rami pacchetti/**) non eseguiti
    if: ${{ !cancelled() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && startsWith(github.ref, 'refs/heads/pacchetti/'))) }}
    # runner e tempo massimo (minuti) per pacchetto. La versione minima di macOS la decidono le librerie (14.0), non il
    # runner. Il 16/11/2026, dopo il passaggio del repository a pubblico, GitHub ha annullato tre volte il job arm64 dopo
    # 15 minuti in coda senza un runner libero (macos-26, macos-15; «capacity constraints» per i Mac arm64); macos-14 non
    # c'è più («configuration 'macos-14-arm64-us-default' is not supported»)
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","mac-arm64":"macos-15","mac-x86_64":"macos-15-intel","windows":"windows-2025"}')[matrix.chiave] }}
    timeout-minutes: ${{ fromJSON('{"linux":120,"mac-arm64":120,"mac-x86_64":150,"windows":180}')[matrix.chiave] }}
    strategy:
      fail-fast: false
      matrix:
        # quali pacchetti (testa del file): tag -> tutti; avvio manuale -> la scelta; pacchetti/<chiave> -> quello; altro -> linux
        chiave: ${{ fromJSON('{"tag":["linux","mac-arm64","mac-x86_64","windows"],"tutti":["linux","mac-arm64","mac-x86_64","windows"],"tre":["linux","mac-arm64","windows"],"linux":["linux"],"windows":["windows"],"mac-arm64":["mac-arm64"],"mac-x86_64":["mac-x86_64"],"pacchetti/tutti":["linux","mac-arm64","mac-x86_64","windows"],"pacchetti/prova":["linux","mac-arm64","mac-x86_64","windows"],"pacchetti/tre":["linux","mac-arm64","windows"],"pacchetti/linux":["linux"],"pacchetti/windows":["windows"],"pacchetti/mac-arm64":["mac-arm64"],"pacchetti/mac-x86_64":["mac-x86_64"]}')[startsWith(github.ref, 'refs/tags/') && 'tag' || (github.event_name == 'workflow_dispatch' && inputs.pacchetti || github.ref_name)] || fromJSON('["linux"]') }}
    steps:
      - name: Fine riga come nel repository
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv e Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # cryptography (server MCP, via pyjwt) non ha ruote per i Mac Intel dalla 49: uv la costruisce dal sorgente con il
      # Rust del runner e l'OpenSSL 3 di Homebrew, collegato in modo statico (nessuna libreria di Homebrew nel programma:
      # chiederebbero la versione di macOS del runner). La ruota costruita resta nella cache di uv
      - name: OpenSSL per costruire cryptography (Mac Intel)
        if: matrix.chiave == 'mac-x86_64'
        timeout-minutes: 10
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          command -v cargo >/dev/null || brew install rust
          { echo "OPENSSL_DIR=$(brew --prefix openssl@3)"; echo "OPENSSL_STATIC=1"; } >> "$GITHUB_ENV"

      # le dipendenze che ci sono solo su macOS (pyobjc) e su Windows (pythonnet, clr-loader, cffi) entrano nel
      # programma compilato: sicurezza.yml controlla solo quelle di Linux. Sui tag e con l'avvio manuale, non nelle prove
      # dei rami pacchetti/** (tre ambienti da installare: minuti di Mac)
      - name: Licenze delle dipendenze di questo sistema
        if: runner.os != 'Linux' && !startsWith(github.ref, 'refs/heads/pacchetti/')
        timeout-minutes: 20
        run: uv run --no-project strumenti/controlli.py licenze

      - name: Ambiente di compilazione (Python 3.12, finestra, MCP, Nuitka)
        timeout-minutes: 20
        run: uv sync --locked --python 3.12 --extra desktop --extra mcp --extra compilazione

      - name: Python dell'ambiente
        id: py
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "python=.venv-compilazione/Scripts/python.exe" >> "$GITHUB_OUTPUT"
          else echo "python=.venv-compilazione/bin/python" >> "$GITHUB_OUTPUT"; fi
          echo "NUITKA_CACHE_DIR=$RUNNER_TEMP/nuitka" >> "$GITHUB_ENV"

      # ccache: strumento di costruzione, non entra nel programma. Su Windows Nuitka usa con MSVC il suo clcache
      - name: ccache
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ccache
          else brew list --versions ccache >/dev/null || brew install ccache; fi
          ccache --version | head -1

      - name: Cache di Nuitka (ripristino)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuitka
          key: nuitka-${{ matrix.chiave }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nuitka-${{ matrix.chiave }}-

      # Inno Setup 6: strumento di costruzione, non entra nel programma (licenza: uso commerciale libero). C'è già
      # sull'immagine windows-2025 di GitHub; se manca si installa
      - name: Inno Setup
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          if ! command -v iscc >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --no-progress -y
          fi

      - name: Compila e impacchetta
        id: compila
        timeout-minutes: ${{ fromJSON('{"linux":100,"mac-arm64":100,"mac-x86_64":130,"windows":150}')[matrix.chiave] }}
        run: |
          inizio=$(date +%s)
          ${{ steps.py.outputs.python }} strumenti/compila.py
          echo "COMPILAZIONE_S=$(( $(date +%s) - inizio ))" >> "$GITHUB_ENV"
          if command -v ccache >/dev/null; then CCACHE_DIR="$(find "$NUITKA_CACHE_DIR/ccache" -mindepth 1 -maxdepth 1 -type d | head -1)" ccache -s || true; fi

      - name: Cache di Nuitka (salvataggio, anche se le prove dopo non vanno)
        if: always() && steps.compila.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuitka
          key: nuitka-${{ matrix.chiave }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Installa il pacchetto (Linux, con apt e le sue dipendenze)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get install -y -q --no-install-recommends xvfb xauth x11-apps ./dist/pacchetti/Impaginatore-*-linux.deb
          echo "PROGRAMMA=/usr/bin/impaginatore" >> "$GITHUB_ENV"

      - name: Monta il DMG (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/pacchetti/Impaginatore-*-${{ matrix.chiave }}.dmg
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/Impaginatore.app"
          echo "PROGRAMMA=$RUNNER_TEMP/dmg/Impaginatore.app/Contents/MacOS/impaginatore-app" >> "$GITHUB_ENV"

      # «//» perché la shell di Git per Windows non scambi le opzioni per percorsi; l'installatore aspetta la fine
      - name: Installa con l'installatore silenzioso (Windows, per l'utente)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          installatore=(./dist/pacchetti/Impaginatore-*-windows.exe)
          "${installatore[0]}" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //LOG="$RUNNER_TEMP\\installazione.log"
          DEST="$(cygpath -u "$LOCALAPPDATA")/Programs/Impaginatore"
          test -f "$DEST/impaginatore.exe"
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          echo "PROGRAMMA=$(cygpath -w "$DEST/impaginatore.exe")" >> "$GITHUB_ENV"

      # tutti i controlli e la finestra vera; Linux dentro xvfb (con le fotografie giudicate)
      - name: Prova il programma installato
        timeout-minutes: 25
        run: |
          prima=(); [ "$RUNNER_OS" = "Linux" ] && prima=(xvfb-run -a -s "-screen 0 1280x800x24")
          "${prima[@]}" ${{ steps.py.outputs.python }} strumenti/verifica_pacchetto.py "$PROGRAMMA" --finestra \
            --rapporto dist/pacchetti/verifica-${{ matrix.chiave }}.json --riepilogo "$GITHUB_STEP_SUMMARY"

      - name: Disinstalla (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          "$DEST/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          for _ in $(seq 30); do [ ! -f "$DEST/impaginatore.exe" ] && break; sleep 2; done
          test ! -f "$DEST/impaginatore.exe"

      - name: Smonta il DMG (macOS)
        if: always() && runner.os == 'macOS'
        run: hdiutil detach "$RUNNER_TEMP/dmg" || true

      - name: Pacchetto e tempi nel riepilogo
        if: ${{ !cancelled() }}
        run: |
          {
            echo "#### Pacchetto ${{ matrix.chiave }} ($ImageOS, $RUNNER_ARCH)"
            for f in dist/pacchetti/*.deb dist/pacchetti/*.dmg dist/pacchetti/*.exe; do
              [ -f "$f" ] && echo "- $(basename "$f"): $(( $(wc -c < "$f") / 1000000 )) MB ($(wc -c < "$f") byte)"
            done
            [ -n "${COMPILAZIONE_S:-}" ] && echo "- compilazione e pacchetto: $(( COMPILAZIONE_S / 60 )) min $(( COMPILAZIONE_S % 60 )) s"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefatto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacchetto-${{ matrix.chiave }}
          # solo pacchetto (con .sha256 e .componenti.json) e riepilogo della verifica: il repository è pubblico
          path: |
            dist/pacchetti/Impaginatore-*
            dist/pacchetti/verifica-${{ matrix.chiave }}.json
            dist/pacchetti/*.png
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}

  wheel:
    name: Wheel (aggiornamenti delle installazioni Python)
    needs: test
    # solo sui tag e con l'avvio manuale, dopo i test: serve al rilascio, non alle prove dei pacchetti
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false
      - name: uv build --wheel
        run: uv build --wheel --out-dir dist/wheel
      - name: Artefatto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/wheel/*.whl
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}
